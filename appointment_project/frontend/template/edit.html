<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <h2>Edit Appointment</h2>

  <form method="POST">
    {% csrf_token %}
    Name: <input type="text" name="name" value="{{ data.1 }}">
    Date: <input type="date" name="date" value="{{ data.2 }}">
    Time: <input type="time" name="time" value="{{ data.3 }}">
    Reason: <input type="text" name="reason" value="{{ data.4 }}">
    <button type="submit">Update</button>
  </form>


</body>

</html>
